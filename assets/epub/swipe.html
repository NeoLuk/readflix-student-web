<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPUB</title>
    <script src="epub.js"></script>

    <link rel="stylesheet" type="text/css" href="examples.css" />

    <style type="text/css">
      html,
      body {
        height: 100%;
        min-height: 0;
        margin: 0;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      #viewer {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        margin: 5px auto;
        background: white;
      }

      .page-edge {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 6;
        width: 64px;
        border: 0;
        padding: 0;
        background: transparent;
        color: #0d2137;
        font-size: 40px;
        line-height: 1;
        cursor: pointer;
      }

      #page-edge-prev {
        left: 0;
      }

      #page-edge-next {
        right: 0;
      }

      .page-edge:hover {
        background: rgba(255, 253, 248, 0.45);
      }

      #contents-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        visibility: hidden;
        pointer-events: none;
      }

      #contents-overlay.is-open {
        visibility: visible;
        pointer-events: auto;
      }

      #contents-scrim {
        position: absolute;
        inset: 0;
        border: 0;
        padding: 0;
        background-color: rgba(0, 0, 0, 0.4) !important;
        opacity: 0;
        transition: opacity 220ms ease;
        cursor: pointer;
      }

      #contents-overlay.is-open #contents-scrim {
        opacity: 1;
      }

      #contents-panel {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(300px, 78vw);
        display: flex;
        flex-direction: column;
        background-color: #fffdf8 !important;
        border-right: 1px solid #ead9c4;
        transform: translateX(-100%);
        transition: transform 220ms cubic-bezier(0.33, 1, 0.68, 1);
      }

      #contents-overlay.is-open #contents-panel {
        transform: none;
      }

      #contents-bar {
        display: flex;
        align-items: center;
        height: 48px;
        padding-left: 16px;
        color: #0d2137;
        font-weight: 800;
      }

      #contents-title {
        flex: 1;
      }

      #contents-close {
        width: 48px;
        height: 48px;
        border: 0;
        background: transparent;
        color: #0d2137;
        font-size: 22px;
        cursor: pointer;
      }

      #contents-list {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: auto;
        border-top: 1px solid #ead9c4;
      }

      #contents-list button {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        padding: 12px 16px;
        text-align: left;
        color: #0d2137;
        font-weight: 700;
        cursor: pointer;
      }

      #contents-list button.is-current {
        background-color: #fff1e4 !important;
      }
    </style>
  </head>
  <body>
    <div id="viewer">
      <button type="button" id="page-edge-prev" class="page-edge" aria-label="上一頁">‹</button>
      <button type="button" id="page-edge-next" class="page-edge" aria-label="下一頁">›</button>
    </div>
    <div id="contents-overlay" aria-hidden="true">
      <button type="button" id="contents-scrim" tabindex="-1"></button>
      <aside id="contents-panel">
        <div id="contents-bar">
          <span id="contents-title"></span>
          <button type="button" id="contents-close">×</button>
        </div>
        <ul id="contents-list"></ul>
      </aside>
    </div>
    <script src="epub_cfi_utils.js"></script>
    <script src="epubView.js"></script>
  </body>
</html>
